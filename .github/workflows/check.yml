name: Check
on: pull_request
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev pkg-config
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.95.0
          npm ci --prefix tests
          npm exec --prefix tests -- playwright install --with-deps chromium
      - run: |
          cargo fmt --manifest-path helper/Cargo.toml --check
          cargo clippy --manifest-path helper/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path helper/Cargo.toml --locked
          cargo build --manifest-path helper/Cargo.toml --locked --examples
          npm test --prefix tests
          node demo/build.mjs
          WEB_ROOT=demo/dist npm run test:browser --prefix tests
