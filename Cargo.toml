[package]
name = "chatgpt-login-helper"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
base64 = "0.23.1"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "form", "json", "rustls"] }
rfd = "0.17.2"
rsa = { version = "0.9.10", features = ["sha2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tiny_http = "0.12.0"
tungstenite = "0.30.0"
url = "2.5.8"
webbrowser = "1.2.4"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
