[package]
name = "chatgpt-login-helper"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
aws-lc-rs = "1.18.2"
base64 = "0.23.1"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "clipboard"] }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "form", "rustls"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny_http = "0.12.0"
tokio = { version = "1.53.3", default-features = false, features = ["rt", "time"] }
tungstenite = "0.30.0"
url = "2.5.8"
webbrowser = "1.2.4"
zip = { version = "9.0.5", default-features = false }

# Synthetic Rust/WebCrypto test fixture; never shipped as the helper.
[[example]]
name = "interop"
path = "../tests/fixtures/interop.rs"
